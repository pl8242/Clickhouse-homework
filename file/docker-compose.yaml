version: "1.0"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-second
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        hard: 262144
        soft: 262144
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: MySecret123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./data:/var/lib/clickhouse
      - ./logs:/var/log/clickhouse-server
